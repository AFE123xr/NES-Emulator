[package]
name = "nes-emulator"
version = "0.1.0"
edition = "2021"

[lib]

name = "nes"
path = "src/lib.rs"

[[bin]]
name = "nes"
path = "src/main.rs"

[dependencies]

sdl2 = "0.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]

opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
